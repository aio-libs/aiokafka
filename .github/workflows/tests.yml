# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Tests

on:
  push:
    branches: [ master, '**' ]
    tags:
      - "v0.[0-9]+.[0-9]+"
      - "v0.[0-9]+.[0-9]+.dev*"
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  test-sanity:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"
        cache: pip  # zizmor: ignore[cache-poisoning]
        cache-dependency-path: |
          requirements-ci.txt
          requirements-docs.txt
          setup.py

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libkrb5-dev

    - name: Install python dependencies
      run: |
        pip install --upgrade pip setuptools
        pip install -r requirements-ci.txt
        pip install -vv -Ue .  # We set -vv to see compiler exceptions/warnings

    - name: Run Unit Tests
      run: |
        make ci-test-unit

    - name: Lint code
      run: |
        make lint

    - name: Check readme for package
      run: |
        make check-readme

    - name: Build doc
      run: |
        pip install -r requirements-docs.txt
        make -C docs html

  test-windows:
    needs: test-sanity
    runs-on: windows-latest

    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python }}
        cache: pip  # zizmor: ignore[cache-poisoning]
        cache-dependency-path: |
          requirements-win-test.txt
          setup.py

    - name: Install python dependencies
      run: |
        pip install --upgrade pip setuptools
        pip install -r requirements-win-test.txt
        pip install -vv -Ue .  # We set -vv to see compiler exceptions/warnings

    - name: Run Unit Tests
      run: |
        make ci-test-unit
        mv coverage.xml coverage-ext.xml
      env:
        PYTHONASYNCIODEBUG: "1"

    - name: Run Unit Tests without extensions
      run: |
        make ci-test-unit
        mv coverage.xml coverage-py.xml
      env:
        AIOKAFKA_NO_EXTENSIONS: "1"

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage-ext.xml
        flags: unit,cext
        name: test-windows-${{ matrix.python }}-ext
      if: ${{ always() }}

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage-py.xml
        flags: unit,purepy
        name: test-windows-${{ matrix.python }}-py
      if: ${{ always() }}

  test-mac:
    needs: test-sanity
    runs-on: macos-latest

    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python }}
        cache: pip  # zizmor: ignore[cache-poisoning]
        cache-dependency-path: |
          requirements-ci.txt
          setup.py

    - name: Install python dependencies
      run: |
        pip install --upgrade pip setuptools
        pip install -r requirements-ci.txt
        pip install -vv -Ue .  # We set -vv to see compiler exceptions/warnings

    - name: Run All Tests
      run: |
        make ci-test-unit
        mv coverage.xml coverage-ext.xml
      env:
        PYTHONASYNCIODEBUG: "1"

    - name: Run All Tests without extensions
      run: |
        make ci-test-unit
        mv coverage.xml coverage-py.xml
      env:
        AIOKAFKA_NO_EXTENSIONS: "1"

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage-ext.xml
        flags: unit,cext
        name: test-mac-${{ matrix.python }}-ext
      if: ${{ always() }}

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage-py.xml
        flags: unit,purepy
        name: test-mac-${{ matrix.python }}-py
      if: ${{ always() }}

  test-linux:
    needs: test-sanity
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - python: "3.14"
            kafka: "2.8.1"
            scala: "2.13"

          # Older python versions against latest broker.
          - python: "3.11"
            kafka: "2.8.1"
            scala: "2.13"
          - python: "3.12"
            kafka: "2.8.1"
            scala: "2.13"
          - python: "3.13"
            kafka: "2.8.1"
            scala: "2.13"

          # Older brokers against latest python version.
          - python: "3.14"
            kafka: "1.1.1"
            scala: "2.12"

          # Kafka 2.1.1 adds Zstandard compression and SASL/OAUTHBEARER token
          # extensions.
          - python: "3.14"
            kafka: "2.1.1"
            scala: "2.12"

          # Kafka 2.3.1 adds static consumer group membership (KIP-345).
          - python: "3.14"
            kafka: "2.3.1"
            scala: "2.12"

          # Kafka 2.4.1 adds FetchRequest v11 and rack-aware fetching (KIP-392).
          - python: "3.14"
            kafka: "2.4.1"
            scala: "2.12"

      fail-fast: false

    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python }}
        cache: pip  # zizmor: ignore[cache-poisoning]
        cache-dependency-path: |
          requirements-ci.txt
          setup.py

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libkrb5-dev krb5-user

    - name: Install python dependencies
      run: |
        pip install --upgrade pip setuptools
        pip install -r requirements-ci.txt
        pip install -vv -Ue .  # We set -vv to see compiler exceptions/warnings

    - name: Run All Tests
      run: |
        make ci-test-all
        mv coverage.xml coverage-ext.xml
      env:
        SCALA_VERSION: ${{ matrix.scala }}
        KAFKA_VERSION: ${{ matrix.kafka }}

    - name: Run All Tests without extensions
      run: |
        make ci-test-all
        mv coverage.xml coverage-py.xml
      env:
        AIOKAFKA_NO_EXTENSIONS: "1"
        SCALA_VERSION: ${{ matrix.scala }}
        KAFKA_VERSION: ${{ matrix.kafka }}

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage-ext.xml
        flags: integration,cext
        name: test-linux-${{ matrix.python }}-${{ matrix.kafka }}-${{ matrix.scala }}-ext
      if: ${{ always() }}

    - name: Upload coverage without cext to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage-py.xml
        flags: integration,purepy
        name: test-linux-${{ matrix.python }}-${{ matrix.kafka }}-${{ matrix.scala }}-py
      if: ${{ always() }}
